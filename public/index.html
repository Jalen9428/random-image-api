<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机图库管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .image-grid img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .drop-area { border: 2px dashed #ccc; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .drop-area:hover { border-color: #3b82f6; background: #f0f9ff; }
    </style>
</head>
<body class="bg-gray-50 p-6">

    <div class="max-w-6xl mx-auto">

        <!-- 标题个性化 -->
        <div class="bg-white rounded-xl shadow p-6 mb-6 flex justify-between items-center flex-wrap gap-4">
            <div>
                <label class="text-sm text-gray-500">网站标题</label>
                <input id="siteTitle" type="text" placeholder="输入你的图库名称" class="text-2xl font-bold border-b-2 border-transparent focus:border-blue-500 outline-none px-2 py-1 w-64" />
            </div>
            <div class="flex gap-3">
                <button onclick="fetchList()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">刷新列表</button>
                <button onclick="window.location.href='/api/random'" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">访问随机 API</button>
            </div>
        </div>

        <!-- 添加图片区域 -->
        <div class="bg-white rounded-xl shadow p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">📤 添加图片到 Notion</h2>

            <!-- 方式1：批量粘贴外链 -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">批量粘贴外链（每行一个）</label>
                <textarea id="urlInput" rows="4" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://example.com/img1.jpg&#10;https://example.com/img2.png"></textarea>
                <button onclick="addUrls()" class="mt-2 px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition">导入外链</button>
            </div>

            <hr class="my-4">

            <!-- 方式2：上传图片文件 (借助免费图床 ImgBB) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">上传图片文件（需免费图床密钥）</label>
                <div class="flex flex-wrap gap-3 items-center">
                    <input id="imgbbKey" type="text" placeholder="请输入 ImgBB API Key" class="border border-gray-300 rounded-lg p-2 flex-1 min-w-[200px]" />
                    <div class="drop-area flex-1 p-2" id="dropArea">
                        <p class="text-gray-500">拖拽图片到这里，或 <span class="text-blue-500">点击选择</span></p>
                        <input id="fileInput" type="file" multiple accept="image/*" class="hidden" />
                    </div>
                </div>
                <div id="uploadStatus" class="mt-2 text-sm text-gray-500"></div>
            </div>
        </div>

        <!-- 预览列表 -->
        <div class="bg-white rounded-xl shadow p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">🖼️ 图片列表 (<span id="imageCount">0</span> 张)</h2>
                <span id="loadingTip" class="text-sm text-gray-400">加载中...</span>
            </div>
            <div id="imageGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- 动态渲染 -->
            </div>
        </div>
    </div>

    <script>
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 加载本地存储的标题
            const savedTitle = localStorage.getItem('siteTitle') || '我的随机图库';
            document.getElementById('siteTitle').value = savedTitle;
            document.title = savedTitle;

            // 加载 ImgBB Key
            const savedKey = localStorage.getItem('imgbbKey') || '';
            document.getElementById('imgbbKey').value = savedKey;

            // 监听标题变化
            document.getElementById('siteTitle').addEventListener('input', (e) => {
                localStorage.setItem('siteTitle', e.target.value);
                document.title = e.target.value;
            });

            // 监听 Key 变化
            document.getElementById('imgbbKey').addEventListener('input', (e) => {
                localStorage.setItem('imgbbKey', e.target.value);
            });

            // 文件拖拽 / 点击
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');

            dropArea.addEventListener('click', () => fileInput.click());
            dropArea.addEventListener('dragover', (e) => e.preventDefault());
            dropArea.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleFiles(e.target.files);
                e.target.value = ''; // 重置
            });

            // 首次加载列表
            fetchList();
        });

        // 获取并渲染列表
        async function fetchList() {
            document.getElementById('loadingTip').style.display = 'block';
            try {
                const res = await fetch('/api/list');
                const data = await res.json();
                if (data.error) throw new Error(data.detail || data.error);

                const grid = document.getElementById('imageGrid');
                const count = document.getElementById('imageCount');
                count.innerText = data.total || 0;

                if (!data.data || data.data.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-gray-400 text-center py-10">暂无图片，快去添加吧！</div>';
                    return;
                }

                grid.innerHTML = data.data.map(item => `
                    <div class="border rounded-lg overflow-hidden shadow-sm hover:shadow-md transition bg-white">
                        ${item.cover ? `<img src="${item.cover}" alt="${item.name}" loading="lazy" onerror="this.src='https://placehold.co/300x200/ccc/999?text=加载失败'" />` : 
                        `<div class="h-[200px] bg-gray-200 flex items-center justify-center text-gray-400">无预览</div>`}
                        <div class="p-2 text-xs truncate text-gray-600" title="${item.name}">${item.name}</div>
                    </div>
                `).join('');

            } catch (err) {
                alert('加载列表失败: ' + err.message);
            }
            document.getElementById('loadingTip').style.display = 'none';
        }

        // 批量添加外链
        async function addUrls() {
            const text = document.getElementById('urlInput').value;
            const urls = text.split('\n').map(s => s.trim()).filter(s => s);
            if (urls.length === 0) return alert('请在文本框中粘贴图片链接');

            if (!confirm(`确定要添加 ${urls.length} 张图片到 Notion 吗？`)) return;

            const btn = event.target;
            btn.disabled = true;
            btn.innerText = '导入中...';

            try {
                const res = await fetch('/api/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`成功导入 ${data.success} 张，失败 ${data.failed} 张`);
                    document.getElementById('urlInput').value = '';
                    fetchList();
                } else {
                    alert('导入失败: ' + (data.detail || data.error));
                }
            } catch (err) {
                alert('网络错误: ' + err.message);
            }
            btn.disabled = false;
            btn.innerText = '导入外链';
        }

        // 处理上传的图片文件 -> 先传到 ImgBB -> 再调用 /api/add
        async function handleFiles(files) {
            const apiKey = document.getElementById('imgbbKey').value.trim();
            if (!apiKey) {
                return alert('请先输入 ImgBB API Key（免费申请：https://api.imgbb.com/）');
            }

            const fileArray = Array.from(files);
            if (fileArray.length === 0) return;

            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.innerText = `正在上传 ${fileArray.length} 张图片到图床...`;

            const uploadedUrls = [];

            for (let i = 0; i < fileArray.length; i++) {
                const file = fileArray[i];
                const formData = new FormData();
                formData.append('key', apiKey);
                formData.append('image', file);

                try {
                    statusDiv.innerText = `上传进度: ${i + 1}/${fileArray.length} (${file.name})`;
                    const res = await fetch('https://api.imgbb.com/1/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (data.success) {
                        uploadedUrls.push(data.data.url);
                    } else {
                        console.warn('上传失败:', file.name, data.error);
                    }
                } catch (err) {
                    console.warn('上传异常:', file.name, err);
                }
            }

            if (uploadedUrls.length === 0) {
                statusDiv.innerText = '上传失败，请检查网络或密钥是否正确。';
                return;
            }

            statusDiv.innerText = `图床上传完成，正在导入 Notion...`;

            // 调用 /api/add 存入 Notion
            try {
                const res = await fetch('/api/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls: uploadedUrls })
                });
                const data = await res.json();
                statusDiv.innerText = `导入完成：成功 ${data.success} 张，失败 ${data.failed} 张`;
                fetchList();
            } catch (err) {
                statusDiv.innerText = '导入 Notion 失败: ' + err.message;
            }
        }
    </script>

</body>
</html>
