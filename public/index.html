<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机图库管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .image-grid img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .drop-area { border: 2px dashed #ccc; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .drop-area:hover { border-color: #3b82f6; background: #f0f9ff; }

        #loginOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #loginOverlay.hidden { display: none; }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-box .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .login-box .btn-group button { flex: 1; min-width: 100px; }

        .card { position: relative; }

        .card .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,0,0,0.85);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            line-height: 32px;
            text-align: center;
            cursor: pointer;
            z-index: 2;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .card .delete-btn:hover { background: red; transform: scale(1.05); }

        .card .rename-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 4px;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .card .rename-btn:hover { background: rgba(0,0,0,0.9); transform: scale(1.05); }

        .card .download-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            z-index: 2;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .card .download-btn:hover { background: rgba(0,0,0,0.9); transform: scale(1.05); }

        .admin-only { display: none; }
        .admin-only.visible { display: block; }

        input:disabled {
            background: #f3f4f6;
            color: #6b7280;
            cursor: not-allowed;
            border-bottom-color: #d1d5db !important;
        }

        /* 移动端触控优化 */
        @media (hover: hover) {
            .card .delete-btn,
            .card .rename-btn,
            .card .download-btn {
                opacity: 0;
            }
            .card:hover .delete-btn,
            .card:hover .rename-btn,
            .card:hover .download-btn {
                opacity: 1;
            }
        }
        @media (hover: none) {
            .card .delete-btn,
            .card .rename-btn,
            .card .download-btn {
                opacity: 0.9;
            }
            .card .delete-btn,
            .card .rename-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
                line-height: 40px;
            }
            .card .download-btn {
                padding: 8px 16px;
                font-size: 15px;
                bottom: 12px;
                right: 12px;
            }
            .card:active .delete-btn,
            .card:active .rename-btn,
            .card:active .download-btn {
                transform: scale(0.92);
            }
        }
    </style>
</head>
<body class="bg-gray-50 p-6">

    <!-- 登录遮罩 -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2 class="text-2xl font-bold mb-4">🔐 管理面板登录</h2>
            <p class="text-gray-600 mb-4">请输入管理员密码，或以访客身份预览图库</p>
            <input id="passwordInput" type="password" placeholder="请输入密码" class="w-full border border-gray-300 rounded-lg p-3 mb-4 focus:ring-2 focus:ring-blue-500 outline-none" />
            <div class="btn-group">
                <button id="loginBtn" class="bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">登录</button>
                <button id="guestBtn" class="bg-gray-500 text-white py-2 rounded-lg hover:bg-gray-600 transition">以访客身份查看图库</button>
            </div>
            <p id="loginError" class="text-red-500 text-sm mt-2 hidden">密码错误，请重试</p>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainContent" class="max-w-6xl mx-auto hidden">

        <!-- 标题个性化（增加保存按钮） -->
        <div class="bg-white rounded-xl shadow p-6 mb-6 flex justify-between items-center flex-wrap gap-4">
            <div class="flex items-center gap-3 flex-wrap">
                <div>
                    <label class="text-sm text-gray-500">网站标题</label>
                    <input id="siteTitle" type="text" placeholder="输入你的图库名称" class="text-2xl font-bold border-b-2 border-transparent focus:border-blue-500 outline-none px-2 py-1 w-64" />
                </div>
                <button id="saveTitleBtn" class="px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>保存标题</button>
            </div>
            <div class="flex gap-3">
                <button onclick="fetchList()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">刷新列表</button>
                <button onclick="window.location.href='/api/random'" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">访问随机 API</button>
            </div>
        </div>

        <!-- 管理功能区域（仅管理员可见） -->
        <div id="adminArea" class="admin-only">
            <div class="bg-white rounded-xl shadow p-6 mb-6">
                <h2 class="text-lg font-semibold mb-4">📤 添加图片到 Notion</h2>

                <!-- 批量外链 -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">批量粘贴外链（每行一个）</label>
                    <textarea id="urlInput" rows="4" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://example.com/img1.jpg&#10;https://example.com/img2.png"></textarea>
                    <button onclick="addUrls()" class="mt-2 px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition">导入外链</button>
                </div>

                <hr class="my-4">

                <!-- 文件上传 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">上传图片文件（需免费图床密钥）</label>
                    <div class="flex flex-wrap gap-3 items-center">
                        <input id="imgbbKey" type="text" placeholder="请输入 ImgBB API Key" class="border border-gray-300 rounded-lg p-2 flex-1 min-w-[200px]" />
                        <div class="drop-area flex-1 p-2" id="dropArea">
                            <p class="text-gray-500">拖拽图片到这里，或 <span class="text-blue-500">点击选择</span></p>
                            <input id="fileInput" type="file" multiple accept="image/*" class="hidden" />
                        </div>
                    </div>
                    <div id="uploadStatus" class="mt-2 text-sm text-gray-500"></div>
                </div>
            </div>
        </div>

        <!-- 图片列表 -->
        <div class="bg-white rounded-xl shadow p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">🖼️ 图片列表 (<span id="imageCount">0</span> 张)</h2>
                <span id="loadingTip" class="text-sm text-gray-400">加载中...</span>
            </div>
            <div id="imageGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- 动态渲染 -->
            </div>
        </div>
    </div>

    <script>
        // ---------- 全局 ----------
        let isAdmin = false;

        function getAdminPassword() {
            return sessionStorage.getItem('adminPassword') || '';
        }
        function setAdminPassword(pwd) {
            sessionStorage.setItem('adminPassword', pwd);
        }

        async function authFetch(url, options = {}) {
            const headers = options.headers || {};
            const password = getAdminPassword();
            if (password) headers['X-Admin-Password'] = password;
            options.headers = headers;
            return fetch(url, options);
        }

        function downloadImage(url) {
            const a = document.createElement('a');
            a.href = `/api/download?url=${encodeURIComponent(url)}`;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function renameImage(pageId, currentName) {
            const newName = prompt('请输入新的图片名称：', currentName);
            if (newName === null || newName.trim() === '') return;
            try {
                const res = await authFetch('/api/rename', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pageId, newName: newName.trim() })
                });
                if (res.status === 401) {
                    alert('登录已过期，请重新登录');
                    sessionStorage.removeItem('adminPassword');
                    location.reload();
                    return;
                }
                const data = await res.json();
                if (res.ok) {
                    alert('重命名成功');
                    fetchList();
                } else {
                    alert('重命名失败: ' + (data.detail || data.error));
                }
            } catch (err) {
                alert('网络错误: ' + err.message);
            }
        }

        // ---------- 初始化 ----------
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/check-auth');
                const data = await res.json();
                if (data.needAuth) {
                    document.getElementById('loginOverlay').classList.remove('hidden');
                    document.getElementById('mainContent').classList.add('hidden');
                } else {
                    isAdmin = true;
                    document.getElementById('loginOverlay').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');
                    document.getElementById('adminArea').classList.add('visible');
                    await initApp();
                }
            } catch (err) {
                alert('检查授权状态失败: ' + err.message);
            }

            document.getElementById('loginBtn').addEventListener('click', async () => {
                const pwd = document.getElementById('passwordInput').value;
                if (!pwd) return;
                try {
                    const res = await fetch('/api/check-auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pwd })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setAdminPassword(pwd);
                        isAdmin = true;
                        document.getElementById('loginOverlay').classList.add('hidden');
                        document.getElementById('mainContent').classList.remove('hidden');
                        document.getElementById('adminArea').classList.add('visible');
                        document.getElementById('loginError').classList.add('hidden');
                        await initApp();
                    } else {
                        document.getElementById('loginError').classList.remove('hidden');
                    }
                } catch (err) {
                    alert('登录请求失败: ' + err.message);
                }
            });

            document.getElementById('guestBtn').addEventListener('click', async () => {
                isAdmin = false;
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('adminArea').classList.remove('visible');
                await initApp();
            });

            document.getElementById('passwordInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('loginBtn').click();
            });
        });

        // ---------- 应用初始化（异步获取全局标题） ----------
        async function initApp() {
            const titleInput = document.getElementById('siteTitle');
            const saveBtn = document.getElementById('saveTitleBtn');
            const DEFAULT_TITLE = '我的随机图库';

            // 1. 尝试从服务器获取全局标题
            let globalTitle = DEFAULT_TITLE;
            try {
                const res = await fetch('/api/settings');
                if (res.ok) {
                    const data = await res.json();
                    if (data.title) globalTitle = data.title;
                } else {
                    console.warn('获取全局标题失败，使用默认值');
                }
            } catch (e) {
                console.warn('获取全局标题异常，使用默认值', e);
            }

            // 2. 更新本地存储和输入框
            localStorage.setItem('siteTitle', globalTitle);
            titleInput.value = globalTitle;
            document.title = globalTitle;

            // 3. 根据权限控制输入框和保存按钮
            titleInput.disabled = !isAdmin;
            saveBtn.disabled = !isAdmin;
            if (!isAdmin) {
                titleInput.title = '访客模式不可修改标题';
                saveBtn.title = '访客模式不可修改标题';
            } else {
                titleInput.title = '';
                saveBtn.title = '保存标题到服务器';
            }

            // 4. 保存按钮事件
            saveBtn.onclick = async function() {
                if (!isAdmin) return;
                const newTitle = titleInput.value.trim();
                if (!newTitle) {
                    alert('标题不能为空，请重新输入');
                    return;
                }
                // 禁用按钮防止重复提交
                saveBtn.disabled = true;
                saveBtn.innerText = '保存中...';
                try {
                    const res = await authFetch('/api/settings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: newTitle })
                    });
                    if (res.status === 401) {
                        alert('登录已过期，请重新登录');
                        sessionStorage.removeItem('adminPassword');
                        location.reload();
                        return;
                    }
                    if (!res.ok) {
                        const errData = await res.json();
                        throw new Error(errData.detail || errData.error || '更新失败');
                    }
                    // 更新本地存储和页面标题
                    localStorage.setItem('siteTitle', newTitle);
                    document.title = newTitle;
                    alert('标题保存成功！');
                } catch (err) {
                    alert('保存标题失败: ' + err.message);
                    // 回退到之前保存的值（从本地存储读取）
                    const fallback = localStorage.getItem('siteTitle') || DEFAULT_TITLE;
                    titleInput.value = fallback;
                    document.title = fallback;
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerText = '保存标题';
                }
            };

            // 5. 输入框内容变化时，仅启用/禁用保存按钮（不自动提交）
            titleInput.oninput = function() {
                if (!isAdmin) return;
                const current = titleInput.value.trim();
                // 如果为空，禁用保存按钮（但允许编辑）
                saveBtn.disabled = (current === '');
            };

            // 加载 ImgBB Key
            const savedKey = localStorage.getItem('imgbbKey') || '';
            document.getElementById('imgbbKey').value = savedKey;
            document.getElementById('imgbbKey').addEventListener('input', (e) => {
                localStorage.setItem('imgbbKey', e.target.value);
            });

            // 文件拖拽 / 点击
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            dropArea.addEventListener('click', () => fileInput.click());
            dropArea.addEventListener('dragover', (e) => e.preventDefault());
            dropArea.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleFiles(e.target.files);
                e.target.value = '';
            });

            // 加载图片列表
            await fetchList();
        }

        // ---------- 其余函数保持不变（fetchList, deleteImage, addUrls, handleFiles） ----------
        async function fetchList() {
            document.getElementById('loadingTip').style.display = 'block';
            try {
                const endpoint = isAdmin ? '/api/list' : '/api/public-list';
                const fetcher = isAdmin ? authFetch : fetch;
                const res = await fetcher(endpoint);
                if (!res.ok) {
                    if (res.status === 401) {
                        alert('登录已过期，请重新登录');
                        sessionStorage.removeItem('adminPassword');
                        location.reload();
                        return;
                    }
                    throw new Error(`HTTP ${res.status}`);
                }
                const data = await res.json();
                if (data.error) throw new Error(data.detail || data.error);

                const grid = document.getElementById('imageGrid');
                document.getElementById('imageCount').innerText = data.total || 0;

                if (!data.data || data.data.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-gray-400 text-center py-10">暂无图片，快去添加吧！</div>';
                    return;
                }

                grid.innerHTML = data.data.map(item => `
                    <div class="card border rounded-lg overflow-hidden shadow-sm hover:shadow-md transition bg-white">
                        ${item.cover ? `<img src="${item.cover}" alt="${item.name}" loading="lazy" onerror="this.src='https://placehold.co/300x200/ccc/999?text=加载失败'" />` :
                        `<div class="h-[200px] bg-gray-200 flex items-center justify-center text-gray-400">无预览</div>`}
                        <div class="p-2 text-xs truncate text-gray-600" title="${item.name}">${item.name}</div>
                        ${isAdmin ? `
                            <button class="rename-btn" onclick="renameImage('${item.id}', '${item.name.replace(/'/g, "\\'")}')">✏️</button>
                            <button class="delete-btn" onclick="deleteImage('${item.id}', '${item.name.replace(/'/g, "\\'")}')">×</button>
                        ` : ''}
                        <button class="download-btn" onclick="downloadImage('${item.cover}')">⬇ 下载</button>
                    </div>
                `).join('');

            } catch (err) {
                alert('加载列表失败: ' + err.message);
            }
            document.getElementById('loadingTip').style.display = 'none';
        }

        async function deleteImage(pageId, fileName) {
            if (!confirm(`确定要删除图片“${fileName}”吗？此操作不可恢复！`)) return;
            try {
                const res = await authFetch(`/api/delete?pageId=${pageId}`, { method: 'DELETE' });
                if (res.status === 401) {
                    alert('登录已过期，请重新登录');
                    sessionStorage.removeItem('adminPassword');
                    location.reload();
                    return;
                }
                const data = await res.json();
                if (res.ok) {
                    alert('删除成功');
                    fetchList();
                } else {
                    alert('删除失败: ' + (data.detail || data.error));
                }
            } catch (err) {
                alert('网络错误: ' + err.message);
            }
        }

        async function addUrls() {
            const text = document.getElementById('urlInput').value;
            const urls = text.split('\n').map(s => s.trim()).filter(s => s);
            if (urls.length === 0) return alert('请在文本框中粘贴图片链接');
            if (!confirm(`确定要添加 ${urls.length} 张图片到 Notion 吗？`)) return;

            const btn = event.target;
            btn.disabled = true;
            btn.innerText = '导入中...';
            try {
                const res = await authFetch('/api/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls })
                });
                if (res.status === 401) {
                    alert('登录已过期，请重新登录');
                    sessionStorage.removeItem('adminPassword');
                    location.reload();
                    return;
                }
                const data = await res.json();
                if (res.ok) {
                    alert(`成功导入 ${data.success} 张，失败 ${data.failed} 张` +
                          (data.errors && data.errors.length ? '\n\n错误详情：' + JSON.stringify(data.errors, null, 2) : ''));
                    document.getElementById('urlInput').value = '';
                    fetchList();
                } else {
                    alert('导入失败: ' + (data.detail || data.error));
                }
            } catch (err) {
                alert('网络错误: ' + err.message);
            }
            btn.disabled = false;
            btn.innerText = '导入外链';
        }

        async function handleFiles(files) {
            const apiKey = document.getElementById('imgbbKey').value.trim();
            if (!apiKey) return alert('请先输入 ImgBB API Key（免费申请：https://api.imgbb.com/）');

            const fileArray = Array.from(files);
            if (fileArray.length === 0) return;

            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.innerText = `正在上传 ${fileArray.length} 张图片到图床...`;
            const uploadedUrls = [];

            for (let i = 0; i < fileArray.length; i++) {
                const file = fileArray[i];
                const formData = new FormData();
                formData.append('key', apiKey);
                formData.append('image', file);
                try {
                    statusDiv.innerText = `上传进度: ${i + 1}/${fileArray.length} (${file.name})`;
                    const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.success) uploadedUrls.push(data.data.url);
                    else console.warn('上传失败:', file.name, data.error);
                } catch (err) {
                    console.warn('上传异常:', file.name, err);
                }
            }

            if (uploadedUrls.length === 0) {
                statusDiv.innerText = '上传失败，请检查网络或密钥是否正确。';
                return;
            }

            statusDiv.innerText = `图床上传完成，正在导入 Notion...`;
            try {
                const res = await authFetch('/api/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls: uploadedUrls })
                });
                if (res.status === 401) {
                    alert('登录已过期，请重新登录');
                    sessionStorage.removeItem('adminPassword');
                    location.reload();
                    return;
                }
                const data = await res.json();
                statusDiv.innerText = `导入完成：成功 ${data.success} 张，失败 ${data.failed} 张` +
                                      (data.errors && data.errors.length ? '\n\n错误详情：' + JSON.stringify(data.errors, null, 2) : '');
                fetchList();
            } catch (err) {
                statusDiv.innerText = '导入 Notion 失败: ' + err.message;
            }
        }
    </script>

</body>
</html>
